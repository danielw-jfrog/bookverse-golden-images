name: Build Image

concurrency:
  group: ci-${{ vars.PROJECT_KEY }}-${{ github.repository }}
  cancel-in-progress: true

# FIXME: Add a cron job to build this every so often (maybe once a week?)
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  JF_URL: ${{ vars.JFROG_URL }}
  JFROG_URL: ${{ vars.JFROG_URL }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
  JF_PROJECT: ${{ vars.PROJECT_KEY }} # Use by JF CLI
  PROJECT_KEY: ${{ vars.PROJECT_KEY }}

jobs:
  build-base-image:
    name: "Build Base Golden Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Repository content access for source code
      id-token: write # OIDC token generation for JFrog authentication
      attestations: write # For SLSA
      packages: write # For SLSA on Docker Images (per docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/use-artifact-attestations)
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v7

      - name: Prepare Strings
        id: strings
        run: |
          echo "::set-output name=date::$(date +'%Y%m%d')"
          #BUILD_NAME: "${{ github.event.repository.name }}_${{ github.workflow }}_${{ github.job }}"
          echo "::set-output name=build_name::${{ github.event.repository.name }}_build-image_${{ github.job }}"
          echo "::set-output name=build_num::$(date +'%Y%m%d').${{ github.run_number }}.${{ github.run_attempt }}"

      # FIXME: Get this to pull from Artifactory via a pypi remote repository
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Configure JFrog CLI
        uses: jfrog/setup-jfrog-cli@v5
        id: jfrog-cli-auth
        with:
          version: 2.121.0
          oidc-provider-name: bvgi-golden-images-github
          oidc-audience: ${{ vars.JFROG_URL }}

      - name: Install the Python dependencies
        env:
          BUILD_NAME: "${{ steps.strings.outputs.build_name }}"
          BUILD_NUMBER: "${{ steps.strings.outputs.build_num }}"
        run: |
          jf pip-config --repo-resolve "bvgi-pypi-remote"
          jf pip install -r requirements.txt --build-name="${BUILD_NAME}" --build-number="${BUILD_NUMBER}"

      - name: Docker Registry Authentication
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ steps.jfrog-cli-auth.outputs.oidc-user }}
          password: ${{ steps.jfrog-cli-auth.outputs.oidc-token }}

      - name: Process Dockerfile Template
        env:
          TEMPLATE_FROM_IMAGE: alpine
          TEMPLATE_FROM_REPO: "${{ vars.PROJECT_KEY }}-docker-remote"
          TEMPLATE_FROM_TAG: 3.24
        run: |
          python ./fill_in_template.py dockerfile-base.jinja

      - name: Build and Push the Image
        id: basebuild
        env:
          BUILD_NAME: "${{ steps.strings.outputs.build_name }}"
          BUILD_NUMBER: "${{ steps.strings.outputs.build_num }}"
          TO_REPO: "${{ vars.PROJECT_KEY }}-golden-internal-docker-dev-local"
          TO_IMAGE: "golden-images/base"
          TO_TAG: "${{ steps.strings.outputs.build_num }}"
        run: |
          jf docker build -t "${{ vars.DOCKER_REGISTRY }}/${{ env.TO_REPO }}/${{ env.TO_IMAGE }}:${{ env.TO_TAG }}" -f dockerfile-base .
          IMAGE_DIGEST=$(docker inspect --format '{{.Id}}' "${{ vars.DOCKER_REGISTRY }}/${{ env.TO_REPO }}/${{ env.TO_IMAGE }}:${{ env.TO_TAG }}")
          IMAGE_DIGEST_TWO=$(docker images --format '{{.Digest}}' "${{ vars.DOCKER_REGISTRY }}/${{ env.TO_REPO }}/${{ env.TO_IMAGE }}:${{ env.TO_TAG }}")
          echo "image_digest=${IMAGE_DIGEST}" >> $GITHUB_OUTPUT
          echo "image_digest = ${IMAGE_DIGEST}"
          echo "image_digest_two = ${IMAGE_DIGEST_TWO}"
          
          echo "Docker Image Inspect:"
          docker inspect "${{ vars.DOCKER_REGISTRY }}/${{ env.TO_REPO }}/${{ env.TO_IMAGE }}:${{ env.TO_TAG }}"
          
          echo "Docker Manifest Inspect:"
          docker manifest inspect "${{ vars.DOCKER_REGISTRY }}/${{ env.TO_REPO }}/${{ env.TO_IMAGE }}:${{ env.TO_TAG }}"
          
          jf docker push "${{ vars.DOCKER_REGISTRY }}/${{ env.TO_REPO }}/${{ env.TO_IMAGE }}:${{ env.TO_TAG }}" --build-name="${{ env.BUILD_NAME }}" --build-number="${{ env.BUILD_NUMBER }}"

      - name: Generate Artifact Attestation (SLSA) for Docker Image
        uses: actions/attest@v4
        env:
          BUILD_NAME: "${{ steps.strings.outputs.build_name }}"
          BUILD_NUMBER: "${{ steps.strings.outputs.build_num }}"
          TO_REPO: "${{ vars.PROJECT_KEY }}-golden-internal-docker-dev-local"
          TO_IMAGE: "golden-images/base"
          TO_TAG: "${{ steps.strings.outputs.build_num }}"
        with:
          subject-name: "${{ vars.DOCKER_REGISTRY }}/${{ env.TO_REPO }}/${{ env.TO_IMAGE }}"
          subject-digest: "${{ steps.basebuild.outputs.image_digest }}"

      #- name: Upload SLSA Evidence
      #  run: |
      #    jf evd create --sigstore-bundle "?" --provider-id github

      - name: Gather the Environment and Push Build Info
        env:
          BUILD_NAME: "${{ steps.strings.outputs.build_name }}"
          BUILD_NUMBER: "${{ steps.strings.outputs.build_num }}"
        run: |
          jf rt build-publish "${BUILD_NAME}" "${BUILD_NUMBER}" --collect-env --env-exclude "*password*;*secret*;*key*;*token*;*auth*" --collect-git-info --dot-git-path .

# Evidences for Artifacts
# Evidences for Build Info

      - name: Create Application Version
        env:
          APP_KEY: "golden-images-base"
          APP_VERSION: "${{ steps.strings.outputs.build_num }}"
          BUILD_NAME: "${{ steps.strings.outputs.build_name }}"
          BUILD_NUMBER: "${{ steps.strings.outputs.build_num }}"
          JFROG_ACCESS_TOKEN: "${{ steps.jfrog-cli-auth.outputs.oidc-token }}"
          OIDC_TOKEN: "${{ steps.jfrog-cli-auth.outputs.oidc-token }}"
        run: |
          python create_application_version.py "${APP_KEY}" "${APP_VERSION}"

      - name: Promote Application Version to Dev Stage
        env:
          APP_KEY: "golden-images-base"
          APP_VERSION: "${{ steps.strings.outputs.build_num }}"
          JFROG_ACCESS_TOKEN: "${{ steps.jfrog-cli-auth.outputs.oidc-token }}"
          OIDC_TOKEN: "${{ steps.jfrog-cli-auth.outputs.oidc-token }}"
        run: |
          python promote_application_version.py "${APP_KEY}" "${APP_VERSION}" "bvgi-DEV"

